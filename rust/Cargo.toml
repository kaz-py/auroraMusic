[package]
name = "rust_lib_aurora_music"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
# preserve_order: el análisis de InnerTube recorre los mapas en el orden del documento.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
aurora_database = { path = "crates/aurora_database" }
aurora_ai_dj = { path = "crates/aurora_ai_dj" }
aurora_audio = { path = "crates/aurora_audio" }
aurora_cache = { path = "crates/aurora_cache" }
aurora_sources = { path = "crates/aurora_sources" }

# El reproductor de escritorio (cpal) no se compila para Android: allí manda Media3.
[target.'cfg(not(target_os = "android"))'.dependencies]
aurora_playback = { path = "crates/aurora_playback" }

# El paquete raíz (el puente) también es la raíz del workspace: Cargokit
# compila `rust/` por nombre de paquete, así que no puede ser un manifiesto virtual.
[workspace]
members = [
  "crates/aurora_database",
  "crates/aurora_ai_dj",
  "crates/aurora_audio",
  "crates/aurora_cache",
  "crates/aurora_playback",
  "crates/aurora_sources",
]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
