[package]
name = "rust_lib_aurora_music"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
aurora_database = { path = "crates/aurora_database" }
aurora_ai_dj = { path = "crates/aurora_ai_dj" }
aurora_cache = { path = "crates/aurora_cache" }

# El paquete raíz (el puente) también es la raíz del workspace: Cargokit
# compila `rust/` por nombre de paquete, así que no puede ser un manifiesto virtual.
[workspace]
members = [
  "crates/aurora_database",
  "crates/aurora_ai_dj",
  "crates/aurora_cache",
]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
