name: Versión de Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Consultar la fuente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Configurar NuGet para WebView2
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: '6.12.1'

      - name: Analizar código Dart
        run: flutter analyze

      - name: Compilar el motor Rust
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Ejecutar pruebas
        run: flutter test

      - name: Preparar enlaces de complementos de Windows
        shell: pwsh
        run: ./scripts/prepare_windows_plugins.ps1

      - name: Descargar y verificar herramientas de Windows
        shell: pwsh
        run: ./scripts/setup_tools.ps1

      - name: Compilar Windows
        id: windows_build
        run: flutter build windows --release --no-pub --dart-define=AURORA_SUPABASE_URL=${{ secrets.AURORA_SUPABASE_URL }} --dart-define=AURORA_SUPABASE_ANON_KEY=${{ secrets.AURORA_SUPABASE_ANON_KEY }} --dart-define=AURORA_LASTFM_API_KEY=${{ secrets.AURORA_LASTFM_API_KEY }} --dart-define=AURORA_LASTFM_SECRET=${{ secrets.AURORA_LASTFM_SECRET }} --dart-define=AURORA_DISCORD_CLIENT_ID=${{ secrets.AURORA_DISCORD_CLIENT_ID }}

      - name: Diagnosticar instalación de CMake en Windows
        if: failure() && steps.windows_build.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: cmake --install build/windows/x64 --config Release --verbose

      - name: Crear paquete de Windows
        shell: pwsh
        run: ./scripts/package_windows.ps1 -OutputDirectory dist/ci

      - name: Cargar paquete de Windows y suma de verificación
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows
          path: |
            dist/ci/Aurora-Windows.zip
            dist/ci/Aurora-Windows.zip.sha256
          if-no-files-found: error
          compression-level: 0
