name: Android ARM64 release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release')
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Consultar la fuente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar paquetes del SDK de Android
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Check signing script with isolated fixtures
        shell: pwsh
        run: ./scripts/test_ci_android_signing.ps1

      - name: Restaurar el almacén de claves de release
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./scripts/ci_android_signing.ps1 -Action Prepare


      - name: Reconstruir bibliotecas WebP para páginas de 16 KB
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) {
            $sdk = $env:ANDROID_SDK_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($sdk)) {
            throw 'No se encontró la ruta del SDK de Android.'
          }
          ./scripts/rebuild_android_webp.ps1 -SdkDirectory $sdk

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Analizar código Dart
        run: flutter analyze

      - name: Compilar el motor Rust
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK release ARM64
        shell: pwsh
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $env:ANDROID_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'aurora-signing/release.jks'
          flutter build apk --release --target-platform android-arm64 --dart-define=AURORA_SUPABASE_URL=${{ secrets.AURORA_SUPABASE_URL }} --dart-define=AURORA_SUPABASE_ANON_KEY=${{ secrets.AURORA_SUPABASE_ANON_KEY }} --dart-define=AURORA_LASTFM_API_KEY=${{ secrets.AURORA_LASTFM_API_KEY }} --dart-define=AURORA_LASTFM_SECRET=${{ secrets.AURORA_LASTFM_SECRET }}
          if ($LASTEXITCODE -ne 0) { throw 'Signed Android release build failed.' }

      - name: Remove temporary release keystore
        if: always()
        shell: pwsh
        run: ./scripts/ci_android_signing.ps1 -Action Cleanup

      - name: Test native Android integrity checks
        working-directory: android
        shell: pwsh
        run: |
          ./gradlew.bat :app:testDebugUnitTest -Ptarget-platform=android-arm64
          if ($LASTEXITCODE -ne 0) { throw 'Native Android tests failed.' }

      - name: Verificar firma, manifiesto y alineación de 16 KB
        shell: pwsh
        run: |
          $apk = Join-Path $env:GITHUB_WORKSPACE 'build/app/outputs/flutter-apk/app-release.apk'
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) {
            $sdk = $env:ANDROID_SDK_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($sdk)) {
            throw 'No se encontró la ruta del SDK de Android.'
          }

          $buildTools = Join-Path $sdk 'build-tools/36.1.0'
          $cmdlineTools = Split-Path (Get-Command sdkmanager.bat -ErrorAction Stop).Source

          & (Join-Path $buildTools 'apksigner.bat') verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) {
            throw 'Falló la verificación de la firma del APK.'
          }

          $debuggable = & (Join-Path $cmdlineTools 'apkanalyzer.bat') manifest debuggable $apk
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo inspeccionar el APK.'
          }
          if ($debuggable.Trim() -ne 'false') {
            throw "El APK de release permite depuración: $debuggable"
          }

          ./scripts/verify_android_alignment.ps1 -Apk $apk -SdkDirectory $sdk

      - name: Copy release APK and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist/android' -Force | Out-Null
          $source = 'build/app/outputs/flutter-apk/app-release.apk'
          $destination = 'dist/android/Aurora-Android-ARM64.apk'
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/android/Aurora-Android-ARM64.apk.sha256'), "$hash  Aurora-Android-ARM64.apk`n", [Text.UTF8Encoding]::new($false))

      - name: Upload Android release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-ARM64
          path: |
            dist/android/Aurora-Android-ARM64.apk
            dist/android/Aurora-Android-ARM64.apk.sha256
          if-no-files-found: error
          compression-level: 0

  debug:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug')
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Consultar la fuente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar paquetes del SDK de Android
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Check signing script with isolated fixtures
        shell: pwsh
        run: ./scripts/test_ci_android_signing.ps1

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Analizar código Dart
        run: flutter analyze

      - name: Compilar el motor Rust
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Ejecutar pruebas
        run: flutter test

      - name: Build development APK without release secrets
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-ARM64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
