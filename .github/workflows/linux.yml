name: Versión de Linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Consultar la fuente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config lld libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libasound2-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Linux
        run: flutter build linux --release --no-pub

      - name: Comprobar bibliotecas del bundle
        run: bash scripts/linux/check_bundle.sh build/linux/x64/release/bundle
